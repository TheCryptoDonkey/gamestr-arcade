appId: dev.forgesworn.gamestr-arcade
productName: gamestr arcade

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - resources/icon.png

# Ship the cabinet config alongside the binary so a booth operator can retune
# the leaderboard / attract timeout / CRT without rebuilding (read from
# process.resourcesPath at runtime).
#
# The offline packages are staged by build:cabinet-games.
# Additional games still come from the operator's ARCADE_GAMES_DIR.
extraResources:
  - from: arcade.config.json
    to: arcade.config.json
  - from: release/cabinet-games
    to: cabinet-games

linux:
  target: [AppImage]
  category: Game
  syncDesktopName: true
  icon: resources/icon.png

appImage:
  artifactName: gamestr-arcade-${version}-${arch}.AppImage

# package:deb gives the installer its own executable and AppArmor profile name.
deb:
  maintainer: The Crypto Donkey <147930957+TheCryptoDonkey@users.noreply.github.com>
  packageCategory: games
  depends:
    - libasound2t64 | libasound2
    - libatspi2.0-0
    - libcups2t64 | libcups2
    - libgbm1
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libsecret-1-0
    - libuuid1
    - libxss1
    - libxtst6
    - xdg-utils
  desktop:
    entry:
      Name: Gamestr Arcade

win:
  target: [nsis]
  executableName: Gamestr Arcade
  icon: resources/icon.png

nsis:
  artifactName: gamestr-arcade-${version}-${arch}-setup.${ext}
  shortcutName: Gamestr Arcade
  createDesktopShortcut: false
  runAfterFinish: false
