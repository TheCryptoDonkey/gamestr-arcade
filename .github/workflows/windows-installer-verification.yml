name: Windows installer verification

on:
  push:
    branches: [codex/windows-btc-play-now]

permissions:
  contents: read

jobs:
  btc-play-now:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the Windows installer
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win
      - name: Build a native game fixture
        shell: powershell
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'release\native fixture'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Threading;
          public static class Game {
            public static void Main() {
              File.WriteAllText(Environment.GetEnvironmentVariable("BTC_PLAY_TEST_MARKER"), Environment.CurrentDirectory);
              Thread.Sleep(1000);
            }
          }
          '@ -OutputAssembly (Join-Path $fixture 'BTC Proof of Play Alias.exe') -OutputType ConsoleApplication
      - name: Verify Play Now from the installed menu
        run: node scripts/verify-windows-btc-play-now.mjs release
      - name: Record the verified installer checksum
        run: |
          $installer = Get-ChildItem release -Filter '*-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding ascii release/SHA256SUMS
      - name: Upload the verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamestr-arcade-windows-btc-play-now-${{ github.sha }}
          path: |
            release/*-setup.exe
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
