name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete source and build gate
        run: npm run check

      - name: Install browser for user journey checks
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y xdotool

      - name: Verify both web editions in the browser
        run: npm run test:browser

      - name: Audit full dependency tree
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > gamestr-arcade.cdx.json

      - name: Package Linux AppImage
        run: npm run dist

      - name: Boot the packaged Linux renderer
        run: bash scripts/smoke-appimage.sh release/*.AppImage release/linux-runtime-smoke.json

      - name: Verify missing game input still fails the packaged gate
        run: node scripts/appimage-input-negative.mjs release/*.AppImage release/linux-input-negative.json

      - name: Record release checksums
        run: cd release && sha256sum *.AppImage > SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamestr-arcade-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/SHA256SUMS
            release/linux-runtime-smoke.json
            release/linux-input-negative.json
            gamestr-arcade.cdx.json
            dist-web/**
            dist-web-600/**
          if-no-files-found: error
          retention-days: 90
