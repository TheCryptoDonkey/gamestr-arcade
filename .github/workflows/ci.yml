name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete source and build gate
        run: npm run check

      - name: Audit full dependency tree
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > gamestr-arcade.cdx.json

      - name: Package Linux AppImage
        run: npm run dist

      - name: Record release checksums
        run: cd release && sha256sum *.AppImage > SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: gamestr-arcade-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/SHA256SUMS
            gamestr-arcade.cdx.json
            dist-web/**
            dist-web-600/**
          if-no-files-found: error
          retention-days: 90
