name: Windows Pallasite verification

on:
  push:
    branches: [codex/windows-pallasite-verification]

permissions:
  actions: read
  contents: read

jobs:
  pallasite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Retrieve the exact Windows candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'cba2caeb00cb3876576fa2a8cc1a1eba01fa7ffa'
          $build = gh run view 44834728362 --json headSha --jq .headSha
          if ($LASTEXITCODE -ne 0 -or $build -ne $source) { throw 'Unexpected Windows build commit' }
          gh run download 44834728362 --name "gamestr-arcade-windows-pallasite-$source" --dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksum, $name = ((Get-Content release/SHA256SUMS) -split '  ', 2)
          if ($name -ne 'gamestr-arcade-0.2.15-x64-setup.exe') { throw 'Unexpected installer name' }
          $actual = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw 'Installer checksum mismatch' }
          Write-Host "Testing Windows installer $name with SHA-256 $actual"
      - name: Install Pallasite from Games Settings and play it
        run: node scripts/verify-windows-pallasite.mjs release
      - name: Create a setup executable for the BTC stale-link regression
        id: btc-fixture
        if: ${{ !cancelled() && steps.candidate.conclusion == 'success' }}
        shell: powershell
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'release\native fixture'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          public static class TestSetup {
            public static void Main() {
              File.WriteAllText(Environment.GetEnvironmentVariable("BTC_PLAY_TEST_MARKER"), Environment.CurrentDirectory);
            }
          }
          '@ -OutputAssembly (Join-Path $fixture 'BTC Proof of Play Setup.exe') -OutputType ConsoleApplication
      - name: Check that the BTC game pack still opens directly
        if: ${{ !cancelled() && steps.btc-fixture.conclusion == 'success' }}
        run: node scripts/verify-windows-btc-game-pack.mjs release
